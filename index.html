    <div id="tr-out" class="mt-4"></div>
  </section>

// ---------- AI helper ----------
let gModels=null;
async function geminiModels(){
  if(gModels)return gModels;
  const fb=['gemini-flash-latest','gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite'];
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(cfg.key));
    const j=await r.json();
    const l=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(m.name)&&!/image|tts|live|audio|thinking|exp|vision/.test(m.name)).map(m=>m.name.replace('models/',''));
    l.sort((a,b)=>(/latest/.test(b)-/latest/.test(a))||b.localeCompare(a));
    gModels=l.length?l.slice(0,5):fb;
  }catch(e){gModels=fb}
  return gModels;
}
async function llm(prompt,json){
  if(!cfg.key||cfg.prov==='none')return null;
  if(cfg.prov==='gemini'){
    let last='';
    for(const m of await geminiModels()){
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(cfg.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:json?{responseMimeType:'application/json'}:{}})});
      if(r.ok)return (await r.json()).candidates[0].content.parts[0].text;
      let msg='';try{msg=(await r.json()).error.message}catch(e){}
      last='Gemini '+r.status+(msg?': '+msg.slice(0,90):'');
      if(![404,429,500,503].includes(r.status))break;
    }
    throw new Error(last);
  }
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.key},body:JSON.stringify(Object.assign({model:'gpt-4o-mini',messages:[{role:'user',content:prompt}]},json?{response_format:{type:'json_object'}}:{}))});
  if(!r.ok)throw new Error('OpenAI error '+r.status);
  return (await r.json()).choices[0].message.content;
}

// ---------- Translator ----------
const opts=CODES.map(c=>`<option value="${c}">${LANGS[c][0]}</option>`).join('');
$('#tr-from').innerHTML=opts;$('#tr-to').innerHTML=opts;$('#tr-from').value='en';$('#tr-to').value='ja';
$('#tr-chips').innerHTML=['Hello','Thank you','Where is the bathroom?','The bill, please'].map(p=>`<button class="shrink-0 rounded-full bg-[#262932] px-3 py-2 text-xs font-semibold text-white/80">${p}</button>`).join('');
$$('#tr-chips button').forEach(b=>b.onclick=()=>{$('#tr-from').value='en';$('#tr-in').value=b.textContent;translate()});
$('#tr-swap').onclick=()=>{const f=$('#tr-from'),t=$('#tr-to'),o=$('#tr-out').dataset.text;[f.value,t.value]=[t.value,f.value];if(o)$('#tr-in').value=o;$('#tr-out').innerHTML='';$('#tr-out').dataset.text=''};
function mockTranslate(text,from,to){
  const i=CODES.indexOf(from),j=CODES.indexOf(to),n=norm(text);
  const row=PB.find(r=>norm(r[i])===n);
  return row?row[j]:null;
}
async function translate(){
  const text=$('#tr-in').value.trim(),from=$('#tr-from').value,to=$('#tr-to').value,out=$('#tr-out');
  if(!text){toast('Type something to translate');return}
  if(from===to){show(text,'Same language');return}
  const btn=$('#tr-go');btn.disabled=true;btn.firstChild.textContent='Translating… ';
  let res=null,tag='Offline demo';
  try{
    const r=await llm(`Translate from ${LANGS[from][0]} to ${LANGS[to][0]}. Reply with the translation only, no notes.\n\n${text}`);
    if(r){res=r.trim();tag=cfg.prov==='gemini'?'Gemini':'OpenAI'}
  }catch(e){toast(e.message+'. Using demo data.')}
  if(!res)res=mockTranslate(text,from,to);
  btn.disabled=false;btn.firstChild.textContent='Translate ';
  if(!res){out.dataset.text='';out.innerHTML=`<div class="rounded-3xl bg-[#1E2028] p-5 text-sm text-white/70">Demo mode only knows ${PB.length} travel phrases, such as “Hello” or “The bill, please”. Add an API key in Settings to translate anything.</div>`;return}
  show(res,tag);
  function show(r,tg){
    out.dataset.text=r;
    out.innerHTML=`<div class="rounded-3xl bg-[#1E2028] p-5 border border-[#FACC15]/30"><div class="flex justify-between text-xs text-white/45"><span>${LANGS[to][0]}</span><span class="rounded-full bg-[#262932] px-2 py-0.5">${tg}</span></div>
    <p class="text-2xl font-bold mt-2 leading-snug">${esc(r)}</p>
    <div class="flex gap-2 mt-4"><button id="tr-say" class="flex-1 rounded-2xl bg-[#FACC15] text-[#121418] font-bold py-3 flex items-center justify-center gap-2"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>Speak</button>
    <button id="tr-copy" class="rounded-2xl bg-[#262932] font-semibold px-5 py-3">Copy</button></div></div>`;
    $('#tr-say').onclick=()=>speak(r,to);
    $('#tr-copy').onclick=()=>navigator.clipboard.writeText(r).then(()=>toast('Copied'),()=>toast('Copy not available'));
  }
}
function speak(txt,lang){
  if(!('speechSynthesis' in window)){toast('Speech is not supported in this browser');return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=LANGS[lang][1];u.rate=.95;speechSynthesis.speak(u);
}
$('#tr-go').onclick=translate;

// ---------- Map ----------
let map,layer;
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const icon=(l,on)=>L.divIcon({className:'',html:`<div class="pin ${on?'on':''}">${l}</div>`,iconSize:[36,36],iconAnchor:[18,18]});
function initMap(){
  if(map)return;
  map=L.map('map',{zoomControl:false}).setView(CITIES[state.city].c,12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on('click',closeSheet);
  drawMap();
}
function chips(){
  const c=Object.entries(CITIES).map(([k,v])=>`<button data-c="${k}" class="shrink-0 rounded-full px-4 py-2 text-sm font-semibold border ${!state.route&&state.city===k?'bg-[#FACC15] text-[#121418] border-[#FACC15]':'bg-[#1E2028]/95 text-white/80 border-white/10'}">${v.name}</button>`).join('');
  const r=state.route?`<button data-clear class="shrink-0 rounded-full px-4 py-2 text-sm font-semibold bg-[#FACC15] text-[#121418]">✕ ${esc(state.route.city)} route</button>`:'';
  $('#map-chips').innerHTML=r+c;
  $$('#map-chips [data-c]').forEach(b=>b.onclick=()=>{state.city=b.dataset.c;state.route=null;drawMap();fitMap();closeSheet()});
  const x=$('#map-chips [data-clear]');if(x)x.onclick=()=>{state.route=null;drawMap();fitMap()};
}
function drawMap(){
  if(!map)return;
  layer.clearLayers();
  if(state.route){
    const pts=[];let n=0;
    state.route.days.forEach((d,di)=>d.stops.forEach(s=>{
      n++;pts.push(s.p);
      L.marker(s.p,{icon:icon(n,true)}).addTo(layer).on('click',()=>openSheet(s,`Day ${di+1} · ${s.time||''}`));
    }));
    L.polyline(pts,{color:'#FACC15',weight:3,dashArray:'6 8',opacity:.8}).addTo(layer);
  }else{
    CITIES[state.city].spots.forEach(s=>L.marker(s.p,{icon:icon(s.e,false)}).addTo(layer).on('click',()=>openSheet(s,CITIES[state.city].name)));
  }
  chips();
}
function fitMap(){
  if(!map)return;
  const pts=state.route?state.route.days.flatMap(d=>d.stops.map(s=>s.p)):CITIES[state.city].spots.map(s=>s.p);
  map.fitBounds(L.latLngBounds(pts).pad(.25),{animate:true,maxZoom:15});
}
function openSheet(s,sub){
  const h=hue(s.n),tags=(s.t||[]).map(t=>`<span class="rounded-full bg-[#262932] px-2.5 py-1 text-xs text-white/70">${t}</span>`).join('');
  $('#sheet').innerHTML=`<div class="h-28 flex items-center justify-center text-6xl" style="background:linear-gradient(135deg,hsl(${h} 55% 28%),hsl(${(h+50)%360} 60% 12%))">${s.e||'📍'}</div>
  <div class="p-5"><div class="text-xs text-[#FACC15] font-bold">${esc(sub)}</div><h3 class="text-xl font-extrabold mt-1">${esc(s.n)}</h3>
  <p class="text-sm text-white/65 mt-2 leading-relaxed">${esc(s.d||'')}</p><div class="flex gap-2 mt-3 flex-wrap">${tags}</div>
  <div class="flex gap-2 mt-4"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.p[0]},${s.p[1]}" class="flex-1 text-center rounded-2xl bg-[#FACC15] text-[#121418] font-bold py-3">Directions</a>
  <button id="sh-x" class="rounded-2xl bg-[#262932] px-5 font-semibold">Close</button></div></div>`;
  $('#sheet').classList.remove('translate-y-[160%]');
  $('#sh-x').onclick=closeSheet;
  map.panTo(s.p,{animate:true});
}
function closeSheet(){$('#sheet').classList.add('translate-y-[160%]')}

// ---------- Facts ----------
$('#f-city').innerHTML=Object.entries(CITIES).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
const KIND={'Local secret':'bg-[#FACC15] text-[#121418]','History':'bg-sky-400/20 text-sky-300','Etiquette':'bg-emerald-400/20 text-emerald-300','Fun fact':'bg-fuchsia-400/20 text-fuchsia-300'};
function renderFacts(){
  const c=CITIES[$('#f-city').value];
  $('#f-list').innerHTML=c.facts.map(f=>`<article class="rounded-3xl bg-[#1E2028] p-5"><span class="inline-block rounded-full px-3 py-1 text-xs font-bold ${KIND[f.k]}">${f.k}</span>
  <h3 class="text-lg font-bold mt-3">${f.t}</h3><p class="text-sm text-white/65 mt-1 leading-relaxed">${f.x}</p></article>`).join('');
}
$('#f-city').onchange=renderFacts;

// ---------- Itinerary ----------
let style='culture';
$('#p-styles').innerHTML=STYLES.map(([k,l,e])=>`<button data-s="${k}" class="rounded-2xl py-3 text-xs font-semibold flex flex-col items-center gap-1"><span class="text-xl">${e}</span>${l}</button>`).join('');
function paintStyles(){$$('#p-styles button').forEach(b=>b.className='rounded-2xl py-3 text-xs font-semibold flex flex-col items-center gap-1 '+(b.dataset.s===style?'bg-[#FACC15] text-[#121418]':'bg-[#262932] text-white/70'))}
$$('#p-styles button').forEach(b=>b.onclick=()=>{style=b.dataset.s;paintStyles()});paintStyles();
$('#p-cities').innerHTML=Object.values(CITIES).map(c=>`<option value="${c.name}">`).join('');
$('#p-days').oninput=e=>$('#p-days-v').textContent=e.target.value+(e.target.value==='1'?' day':' days');
function mockTrip(key,days,st){
  const c=CITIES[key],times=['09:30','13:00','17:30'];
  const pool=[...c.spots].sort((a,b)=>b.t.includes(st)-a.t.includes(st));
  const per=Math.min(3,Math.max(2,Math.ceil(pool.length/days)));
  return {city:c.name,key,days:Array.from({length:days},(_,i)=>{
    const stops=Array.from({length:per},(_,j)=>Object.assign({},pool[(i*per+j)%pool.length],{time:times[j]}));
    return {title:stops[0].n+' & nearby',stops}})};
}
async function aiTrip(dest,days,st){
  const r=await llm(`Create a ${days}-day ${st} travel itinerary for ${dest}. Reply with JSON only: {"days":[{"title":"short title","stops":[{"n":"place name","lat":0,"lng":0,"d":"one sentence tip","time":"09:30"}]}]} with 3 stops per day and real coordinates.`,true);
  if(!r)return null;
  const j=JSON.parse(r.replace(/```json|```/g,'').trim());
  return {city:dest,key:null,days:j.days.map(d=>({title:d.title,stops:d.stops.map(s=>({n:s.n,p:[+s.lat,+s.lng],e:'📍',d:s.d,time:s.time,t:[st]}))}))};
}
async function plan(){
  const dest=$('#p-dest').value.trim(),days=+$('#p-days').value;
  if(!dest){toast('Enter a destination');return}
  const key=Object.keys(CITIES).find(k=>dest.toLowerCase().includes(k));
  const btn=$('#p-go');btn.disabled=true;btn.textContent='Planning…';
  let trip=null;
  try{trip=await aiTrip(dest,days,style)}catch(e){toast('AI planning failed. '+(key?'Using demo data.':e.message))}
  if(!trip&&key)trip=mockTrip(key,days,style);
  btn.disabled=false;btn.textContent='Plan my trip';
  if(!trip){toast('Demo covers Paris, Tokyo, Istanbul and Rome. Add an API key for other places.');return}
  state.route=trip;if(trip.key)state.city=trip.key;
  drawMap();renderTrip();
  toast('Route added to the map');
}
function renderTrip(){
  const t=state.route;if(!t)return;
  let n=0;
  $('#p-out').innerHTML=`<button id="p-map" class="w-full rounded-2xl bg-[#262932] border border-[#FACC15]/40 text-[#FACC15] font-bold py-3">View route on map</button>`+
  t.days.map((d,di)=>`<div class="rounded-3xl bg-[#1E2028] p-5"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-[#FACC15] text-[#121418] font-extrabold flex items-center justify-center text-sm">${di+1}</div><div><div class="text-xs text-white/45">Day ${di+1}</div><h3 class="font-bold leading-tight">${esc(d.title)}</h3></div></div>
  <div class="mt-3 space-y-1">${d.stops.map((s,si)=>{n++;return `<button data-d="${di}" data-s="${si}" class="w-full text-left flex gap-3 rounded-2xl p-3 hover:bg-white/5 active:bg-white/10"><span class="text-xs text-white/40 w-11 pt-0.5">${esc(s.time||'')}</span><span class="flex-1"><b class="text-sm block">${s.e||'📍'} ${esc(s.n)}</b><span class="text-xs text-white/55">${esc(s.d||'')}</span></span><span class="text-[#FACC15] text-xs font-bold">#${n}</span></button>`}).join('')}</div></div>`).join('');
  $('#p-map').onclick=()=>go('map');
  $$('#p-out [data-d]').forEach(b=>b.onclick=()=>{const di=+b.dataset.d,s=t.days[di].stops[+b.dataset.s];go('map');setTimeout(()=>{map.setView(s.p,15);openSheet(s,`Day ${di+1} · ${s.time||''}`)},120)});
}
$('#p-go').onclick=plan;

// ---------- Settings ----------
function openModal(){$('#m-prov').value=cfg.prov;$('#m-key').value=cfg.key;$('#modal').classList.remove('hidden');$('#modal').classList.add('flex')}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').classList.remove('flex')}
function saveCfg(){try{localStorage.setItem('nomadai-cfg',JSON.stringify(cfg))}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('.js-settings'))openModal()});
$('#m-x').onclick=closeModal;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#m-save').onclick=()=>{cfg={prov:$('#m-prov').value,key:$('#m-key').value.trim()};if(!cfg.key)cfg.prov='none';saveCfg();closeModal();toast(cfg.prov==='none'?'Using offline demo data':'AI provider saved')};
$('#m-clear').onclick=()=>{cfg={prov:'none',key:''};saveCfg();closeModal();toast('Key removed')};

// ---------- Key bindings ----------
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeSheet()}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    if(!$('#s-translate').classList.contains('hidden'))translate();
    else if(!$('#s-plan').classList.contains('hidden'))plan();
  }
});

renderFacts();go('translate');
</script>
</body>
